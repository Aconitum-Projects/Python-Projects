mediapipe_info:
  camera_index: 0
  camera_fallback_indexes: [1, 2, 3]
  camera_auto_scan_enabled: true
  camera_auto_scan_max_index: 8
  camera_open_retries: 3
  camera_retry_delay_seconds: 0.6
  camera_warmup_frames: 3
  camera_prefer_mjpg: true
  camera_backends: ["dshow", "msmf", "any", "auto"]
  frame_width: 1280
  frame_height: 720
  blink_mode: "max"  # max ou avg
  model_path: "config/face_landmarker.task"
  auto_download_model: true
  model_url: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"

OSC_output:
  ip: "127.0.0.1"
  port: 7000
  base_address: "/blink"

blink_detection:
  threshold: 0.6          # seuil de fermeture (montée)
  threshold_off: 0.35     # seuil de réouverture (descente) — hysteresis anti-oscillation
  trigger_edge: "press"  # press/rising = instantané, release/falling = au relâchement
  loop_sleep_seconds: 0.005
  rearm_threshold: 0.48   # rearm plus tôt pour accepter les clignements rapides
  min_trigger_interval_ms: 70

left_hand_detection:
  enabled: true
  min_closed_fingers: 4         # index, majeur, annulaire, auriculaire
  finger_closed_margin: 0.015   # marge anti-bruit (coordonnees normalisees)
  thumb_closed_ratio: 0.75      # plus petit = pouce plus proche de la paume requis
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.5
  min_presence_confidence: 0.5
  model_path: "config/hand_landmarker.task"
  auto_download_model: true
  model_url: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
  invert_handedness: false      # passer a true si la gauche/droite est inversée

right_hand_detection:
  enabled: true
  # Les autres valeurs héritent de left_hand_detection.
  # Tu peux override ici si besoin: min_closed_fingers, finger_closed_margin, thumb_closed_ratio, etc.

gaze_pause:
  enabled: true
  direction_pause: "right"   # regard à droite (physique) = mise en pause
  direction_resume: "left"   # regard à gauche (physique) = reprise
  yaw_threshold: 20
  pitch_threshold: 0
  cooldown_seconds: 1.5
  debug_logs: true

pause_trigger:
  enabled: true
  key: "esc"
  force_win32: true
  fallback_win32_direct: true
  cooldown_ms: 120
  hold_ms: 45

keyboard_trigger:
  enabled: true
  window_title: "Rhythm Doctor"
  exclude_window_substrings: ["Accessibility Addon"]
  key: "space"
  hold_ms: 50
  cooldown_ms: 70
  focus_window: true
  focus_delay_ms: 80
  send_method: "auto"  # auto, directinput, pyautogui, win32
  allow_method_fallback: true
  debug_logs: true

hand_trigger:
  enabled: true
  allow_when_paused: false
  left_hand_key: "left"
  right_hand_key: "right"
  left_thumb_key: "down"
  right_thumb_key: "up"
  cooldown_ms: 70
  hold_ms: 45
